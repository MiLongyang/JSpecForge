[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jspecforge"
version = "0.0.0"
description = "LLM-based pipeline for generating and verifying Java JML specifications"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "mloser" }]
dependencies = [
    "pyyaml>=6.0",
    "PyMySQL>=1.1.0",
    "DBUtils>=3.1.0",
    "requests>=2.31",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
jspecforge = "jspecforge.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jspecforge = ["prompts/**/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
